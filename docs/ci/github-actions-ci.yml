name: CI

# The test suite had been failing for four released versions without anyone
# noticing, and the frontend image was never built from its lockfile. This runs
# both on every push and pull request.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  backend-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_data_steward
          POSTGRES_USER: steward
          POSTGRES_PASSWORD: steward
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U steward -d ai_data_steward"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests against PostgreSQL
        # The timezone defect only reproduced on SQLite; running both keeps the
        # two backends honest about the datetime contract.
        env:
          DATABASE_URL: postgresql+psycopg://steward:steward@localhost:5432/ai_data_steward
        run: python -m pytest -q

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r backend/requirements.txt --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --package-lock-only --audit-level=high

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the production compose file
        run: |
          cp .env.production.example .env.ci
          sed -i 's/CHANGE_ME_LONG_RANDOM_DATABASE_PASSWORD/ci-placeholder-password/' .env.ci
          sed -i 's/CHANGE_ME_AT_LEAST_32_RANDOM_CHARACTERS/ci-placeholder-signing-key-0123456789/' .env.ci
          docker compose --env-file .env.ci -f docker-compose.prod.yml config >/dev/null
      - name: Build the backend image
        run: docker build -t ai-data-steward-backend:ci ./backend
      - name: Build the frontend image
        run: docker build -t ai-data-steward-frontend:ci ./frontend
