services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_data_steward
      POSTGRES_USER: steward
      POSTGRES_PASSWORD: steward
    ports:
      # Loopback only: demo mode trusts the X-User-Email header, and this
      # database uses a development password.
      - "127.0.0.1:5433:5432"
    volumes:
      - ads_stage3_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      APP_ENV: development
      APP_VERSION: 0.4.4-h
      ENABLE_API_DOCS: "true"
      SEED_DEMO_DATA: "true"
      TRUSTED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgresql+psycopg://steward:steward@db:5432/ai_data_steward
      CORS_ORIGINS: http://localhost:5173
      AUTH_MODE: demo
      AUTH_SECRET_KEY: development-only-change-me-1234567890
      CATALOG_PUBLISHER: mock
      TESTGEN_MODE: ${TESTGEN_MODE:-mock}
      TESTGEN_BASE_URL: ${TESTGEN_BASE_URL:-http://host.docker.internal:8530}
      TESTGEN_AUTH_MODE: ${TESTGEN_AUTH_MODE:-oauth_refresh}
      TESTGEN_TOKEN: ${TESTGEN_TOKEN:-}
      TESTGEN_OAUTH_CLIENT_ID: ${TESTGEN_OAUTH_CLIENT_ID:-}
      TESTGEN_OAUTH_CLIENT_SECRET: ${TESTGEN_OAUTH_CLIENT_SECRET:-}
      TESTGEN_OAUTH_REFRESH_TOKEN: ${TESTGEN_OAUTH_REFRESH_TOKEN:-}
      TESTGEN_PROJECT_CODE: ${TESTGEN_PROJECT_CODE:-}
      TESTGEN_TABLE_GROUP_ID: ${TESTGEN_TABLE_GROUP_ID:-}
      TESTGEN_TEST_SUITE_ID: ${TESTGEN_TEST_SUITE_ID:-}
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

volumes:
  ads_stage3_pgdata:
